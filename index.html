<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyroute — One URL. Your keys. Every provider.</title>
    <meta name="description" content="Add your OpenAI, Gemini, Groq, or custom API keys with a label. Get one base URL. Route to any key by prefixing the model name — and your credentials stay AES-encrypted in your own Supabase." />
    <meta property="og:title" content="Keyroute — One URL. Your keys. Every provider." />
    <meta property="og:description" content="Unified AI API gateway. Your keys, your Supabase, zero plaintext credential storage." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const storedTheme = localStorage.getItem('keyroute-theme');
          if (storedTheme === 'light' || storedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', storedTheme);
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
